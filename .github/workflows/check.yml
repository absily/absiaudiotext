name: Validate ABSI Audio Cloud
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install backend and test dependencies
        run: pip install -r backend/requirements.txt pytest httpx
      - name: Test Python API and article handling
        run: python -m pytest -q tests/
      - name: Check Worker JavaScript syntax
        run: node --check worker/index.js
