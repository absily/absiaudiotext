services:
  - type: web
    name: absi-audio-piper
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: WORKER_SHARED_SECRET
        sync: false
      - key: R2_ENDPOINT
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
